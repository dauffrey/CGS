name: CG-EXP-0001 synthetic harness

on:
  pull_request:
    paths:
      - 'src/cgs/**'
      - 'tests/**'
      - 'experiments/CG-EXP-0001*.md'
      - 'pyproject.toml'
      - '.github/workflows/cg-exp-0001-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest

      - name: Run CG-EXP-0001 synthetic controls
        run: python -m cgs.experiment --output-dir artifacts

      - name: Upload instrumentation report
        uses: actions/upload-artifact@v4
        with:
          name: cg-exp-0001-synthetic-report
          path: artifacts/
          if-no-files-found: error
